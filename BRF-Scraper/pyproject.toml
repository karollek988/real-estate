[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brf-scraper"
version = "0.1.0"
description = "Production-ready BRF (Bostadsrättsförening) annual report scraper"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "BRF Scraper Team" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "aiosqlite>=0.19.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiofiles>=23.2.1",
    "redis[hiredis]>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "respx>=0.21.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
browser = [
    "playwright>=1.40.0",
]
camoufox = [
    "camoufox>=0.1.0",
    # camoufox's patched Firefox speaks an older CDP dialect; playwright
    # 1.50+ sends a viewport.isMobile field it rejects (new_page/new_context
    # both fail with a Browser.setDefaultViewport protocol error).
    "playwright==1.49.1",
]
ocr = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.6.0",
]

[project.scripts]
brf-scraper = "brf_scraper.main:app"

[project.urls]
Repository = "https://github.com/your-org/brf-scraper"
Documentation = "https://github.com/your-org/brf-scraper#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/brf_scraper"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["brf_scraper"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["camoufox.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["brf_scraper"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]
