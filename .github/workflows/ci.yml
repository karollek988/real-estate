name: CI

# What has to be green before a pull request can be merged into main (see CONTRIBUTING.md).
# The branch rule for main (.github/rulesets/protect-main.json) requires one thing only: the job called
# "CI passed" at the bottom of this file. To make a new check mandatory, add it as a job here and list it in
# that job's `needs` - the rule itself does not have to change.
#
# Run the same checks locally before pushing:
#   cd frontend && npm run typecheck && npm run i18n:check && npm run verify
#   python -m pytest api/tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# A new push to the same pull request replaces the run that is still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-name:
    name: Branch name
    # Only meaningful for a pull request; a push to main has no source branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Branch must be feature/..., fix/... or refactor/...
        env:
          # Passed through the environment, never pasted into the script: a branch name is user input.
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" =~ ^(feature|fix|refactor)/[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "OK: $HEAD_REF"
          else
            echo "::error title=Branch name::'$HEAD_REF' does not follow the naming rule. Use feature/<short-name>, fix/<short-name> or refactor/<short-name> (lowercase letters, digits, - . _ /). See CONTRIBUTING.md."
            exit 1
          fi

  frontend:
    name: Frontend (types, texts, verify scripts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Texts (Swedish and English complete, same keys)
        run: npm run i18n:check

      - name: Verify scripts
        run: npm run verify

  api:
    name: Python API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt pytest

      - name: Tests
        run: python -m pytest api/tests

  # The one check the branch rule asks for. It is green when every job above is, and it is the only name that
  # has to be listed in the rule, so adding or renaming a job above never needs a settings change.
  ci-passed:
    name: CI passed
    needs: [branch-name, frontend, api]
    # Without this a failed job above would skip this one, and a skipped required check can count as passing.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=0
          for job in frontend api; do
            [ "$(echo "$NEEDS" | jq -r ".\"$job\".result")" = "success" ] || failed=1
          done
          # The branch name only exists on a pull request; on a push to main that job is skipped, which is fine.
          name_result="$(echo "$NEEDS" | jq -r '."branch-name".result')"
          [ "$name_result" = "success" ] || [ "$name_result" = "skipped" ] || failed=1
          exit $failed
